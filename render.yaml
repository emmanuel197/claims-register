# Render Blueprint — https://render.com/docs/blueprint-spec
# Lives at the repo root (where Render looks for it); the service itself is
# rooted in backend/. The database is an external Neon Postgres: DATABASE_URL
# is set in the dashboard (sync: false) so the connection string is never
# committed.
services:
  - type: web
    name: claims-register-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"
